name: RideFleet CI/CD

# Pipeline em estágios: build → testes unitários → testes de contrato do Core
# → teste de integração (compose + smoke) → deploy automático (push na main).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Build ────────────────────────────────────────────────────────────────
  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Build
        run: docker build ./backend -t ridefleet-backend:ci

  # ── 2. Testes unitários ─────────────────────────────────────────────────────
  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements.txt

      - name: Rodar testes unitários (sem os de contrato)
        run: |
          cd backend
          pytest tests/ -v --ignore=tests/test_contrato.py --cov=. --cov-report=term-missing

  # ── 3. Testes de contrato do Core ───────────────────────────────────────────
  # Simulam exatamente as chamadas que o Core faz nos webhooks
  # (/rides/incoming e /rides/{uuid}/assigned) e validam o /metrics.
  testes-contrato:
    name: Testes de contrato do Core
    runs-on: ubuntu-latest
    needs: testes-unitarios
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements.txt

      - name: Rodar testes de contrato
        run: |
          cd backend
          pytest tests/test_contrato.py -v

  # ── 4. Teste de integração ──────────────────────────────────────────────────
  # Sobe a stack inteira (nginx + 2 backends + postgres + rabbitmq) e bate nos
  # endpoints reais via load balancer. CORE_URL aponta para uma porta fechada:
  # sem Core alcançável, o /assigned deve compensar e responder 409.
  teste-integracao:
    name: Teste de integração (compose)
    runs-on: ubuntu-latest
    needs: testes-contrato
    env:
      CORE_URL: http://127.0.0.1:9/api/v1
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Subir stack completa
        run: docker compose up -d --build

      - name: Aguardar serviço ficar saudável
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health > /dev/null 2>&1; then
              echo "serviço saudável após $((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "::error::/health não respondeu a tempo"
          docker compose logs
          exit 1

      - name: Smoke — health e métricas de observabilidade
        run: |
          curl -fsS http://localhost:5000/health
          curl -fsS http://localhost:5000/metrics -o /tmp/metrics.txt
          for m in ridefleet_rides_local_total ridefleet_rides_delegated_total \
                   ridefleet_rides_received_total ridefleet_rides_latencia_media_ms \
                   ridefleet_throughput_rps ridefleet_service_state \
                   ridefleet_fila_entrada ridefleet_fila_saida instance_id; do
            grep -q "$m" /tmp/metrics.txt || { echo "::error::métrica ausente: $m"; exit 1; }
          done

      - name: Smoke — webhook /rides/incoming responde proposta
        run: |
          code=$(curl -s -o /tmp/incoming.json -w '%{http_code}' \
            -X POST http://localhost:5000/rides/incoming \
            -H 'Content-Type: application/json' \
            -d '{"rideUuid":"ci-incoming","origin":{"lat":-20.75,"lng":-42.88},"destination":{"lat":-20.80,"lng":-42.90},"originServiceId":"grupo-ci","passengerId":"p-ci","logicalTimestamp":1,"auctionDeadline":"2030-01-01T00:00:00Z"}')
          cat /tmp/incoming.json
          test "$code" = "200"
          grep -q estimatedEta   /tmp/incoming.json
          grep -q estimatedPrice /tmp/incoming.json

      - name: Smoke — webhook /assigned compensa sem Core (409)
        run: |
          code=$(curl -s -o /tmp/assigned.json -w '%{http_code}' \
            -X POST http://localhost:5000/rides/ci-assigned/assigned \
            -H 'Content-Type: application/json' \
            -d '{"rideUuid":"ci-assigned","origin":{"lat":0,"lng":0,"street":"Rua A"},"destination":{"lat":0,"lng":0,"street":"Rua B"},"originServiceId":"grupo-ci","passengerId":"p-ci","logicalTimestamp":2,"lockExpiresAt":"2030-01-01T00:00:00Z"}')
          cat /tmp/assigned.json
          test "$code" = "409"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derrubar stack
        if: always()
        run: docker compose down -v

  # ── 5. Deploy automático (somente push na main) ─────────────────────────────
  # Publica a imagem no GitHub Container Registry com as tags :latest e :<sha>.
  # A máquina de apresentação consome com:
  #   docker pull ghcr.io/<owner>/<repo>/backend:latest
  deploy:
    name: Deploy — publicar imagem no GHCR
    runs-on: ubuntu-latest
    needs: teste-integracao
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome da imagem (minúsculas)
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"

      - name: Build e push
        run: |
          docker build ./backend \
            -t "${{ steps.img.outputs.image }}:latest" \
            -t "${{ steps.img.outputs.image }}:${{ github.sha }}"
          docker push "${{ steps.img.outputs.image }}:latest"
          docker push "${{ steps.img.outputs.image }}:${{ github.sha }}"
