$kind: http-request
url: "{{base_url}}/rides/status/{{corrida_id}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Tem id', () => pm.expect(pm.response.json().id).to.exist);
    language: text/javascript
order: 2000
