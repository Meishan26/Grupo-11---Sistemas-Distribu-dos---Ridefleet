$kind: http-request
url: "{{base_url}}/rides/avancar/{{corrida_id}}"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: '{ "status": "confirm" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Status confirm', () => pm.expect(pm.response.json().status).to.eql('confirm'));
    language: text/javascript
order: 3000
