events {
    worker_connections 1024;
}

http {

    # ── Log de acesso estruturado ─────────────────────────────────────────────
    log_format json_access escape=json
        '{'
            '"time":"$time_iso8601",'
            '"metodo":"$request_method",'
            '"rota":"$request_uri",'
            '"status":$status,'
            '"duracao_ms":$request_time,'
            '"bytes_enviados":$bytes_sent,'
            '"ip_cliente":"$remote_addr",'
            '"upstream":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log  warn;

    # ── Upstream: least_conn distribui para o backend menos ocupado ──────────
    upstream ridefleet {
        least_conn;
        server backend1:5000;
        server backend2:5000;

        keepalive 32;   # reutiliza conexões TCP com os backends
    }

    server {
        listen 80;

        # ── Timeouts ─────────────────────────────────────────────────────────
        proxy_connect_timeout  5s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # ── Headers repassados ao backend ────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Rota principal: toda requisição vai para o pool ──────────────────
        location / {
            proxy_pass http://ridefleet;

            # se o backend cair, tenta o outro automaticamente
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # ── Health check do próprio Nginx ────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","servico":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
